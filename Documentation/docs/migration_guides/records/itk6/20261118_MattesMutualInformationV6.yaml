schema_version: 1
title: Mattes mutual information v6 repeats derivatives for a fixed number of work units
summary: |
  `MattesMutualInformationImageToImageMetricv6` is new. It computes the same
  metric as `MattesMutualInformationImageToImageMetricv4`, but accumulates the
  joint PDF derivatives of transforms without local support (for example affine
  and `BSplineTransform`) in one array per work unit and adds the arrays in
  work-unit order, so repeated runs with the same number of work units give
  bit-identical derivatives. A different number of work units groups the sum
  differently, so the derivative can still change at the level of floating-point
  rounding. `MattesMutualInformationImageToImageMetricv4` is unchanged.
details: |
  **What you need to do**

  Nothing. To get repeatable derivatives, use
  `MattesMutualInformationImageToImageMetricv6` in place of
  `MattesMutualInformationImageToImageMetricv4`; it has the same interface, plus
  `SetMaximumJointPDFDerivativesBytes()`. A subclass of v4 that used
  `DerivativeBufferManager`, `FinalizeThread()`, `m_ThreaderDerivativeManager`,
  or `m_JointPDFDerivativesLock` should accumulate into
  `m_ThreaderJointPDFDerivatives[threadId]` if moved to v6.

  Each v6 work unit's array takes bins^2 x parameters values, so the derivative
  pass uses no more work units than `SetMaximumJointPDFDerivativesBytes()`
  allows. The default (0) allows one array plus 32 MiB per thread, where threads
  is the requested number of work units, at most the global default number of
  threads. For example, a 3-D `BSplineTransform` on a 10 x 10 x 10 mesh (6591
  parameters) with 32 bins needs about 51 MiB of doubles per work unit, so at 16
  threads it uses 10 work units and about 515 MiB. A nonzero value is a hard
  limit on the total, down to one work unit. Transforms with local support, such
  as `DisplacementFieldTransform`, keep no such arrays and are not limited.

  With the default, the number of work units used, and so the summation order,
  can follow the global thread count. To keep the number of work units fixed
  whatever the machine's thread count, set both `SetMaximumNumberOfWorkUnits()`
  and a nonzero `SetMaximumJointPDFDerivativesBytes()`. Different compilers or
  processors can still round differently.
