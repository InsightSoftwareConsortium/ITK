name: pre-commit

on:
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v5
    - name: Check install of Python, pre-commit
      run: |
        ./Utilities/GitSetup/setup-precommit
        git config hooks.SetupForDevelopment 99
        git config user.email "you@example.com"
        git config user.name "Your Name"
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Test the migration-record tools
      run: |
        python -m pip install pyyaml==6.0.2 jsonschema==4.23.0 yamllint==1.35.1 pytest
        python -m pytest -q Utilities/Maintenance/MigrationRecordsTests
    - uses: pre-commit/action@v3.0.1
